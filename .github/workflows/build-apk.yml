

name: Build patched Mobile Harness APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mobile-Harness-1.0.7-ranked-features-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out build repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Restore dependencies and patch source
        run: |
          set -euo pipefail

          SOURCE_ZIP="Mobile-Harness-1.0.7-ranked-features-source.zip"
          test -f "$SOURCE_ZIP"

          mkdir -p "$RUNNER_TEMP/mh-patched"

          unzip -q "$SOURCE_ZIP" \
            -d "$RUNNER_TEMP/mh-patched"

          git clone --depth 1 \
            --branch v1.0.7 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/techjarves/Mobile-Harness.git \
            "$RUNNER_TEMP/mh-build"

          cp -a \
            "$RUNNER_TEMP/mh-patched/Mobile-Harness-1.0.7/." \
            "$RUNNER_TEMP/mh-build/"


          # Fix the malformed string resource before building.
          python3 - "$RUNNER_TEMP/mh-build/app/src/main/res/values/strings.xml" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit(f"ERROR: strings.xml not found: {path}")

          source = path.read_text(encoding="utf-8")
          pattern = r'<string\s+name="provider_local_model_help"[^>]*>.*?</string>'
          replacement = (
              '<string name="provider_local_model_help">'
              'Enter the model URL and model name, then test the connection.'
              '</string>'
          )
          result, count = re.subn(pattern, replacement, source, count=1, flags=re.DOTALL)

          if count != 1:
              raise SystemExit(f"Expected one matching string resource; found {count}")

          path.write_text(result, encoding="utf-8")
          print("Fixed provider_local_model_help")
          PY

          chmod +x "$RUNNER_TEMP/mh-build/gradlew"

          test -f \
            "$RUNNER_TEMP/mh-build/third_party/proot/src/cli/proot.c"

          test -f \
            "$RUNNER_TEMP/mh-build/third_party/libandroid-shmem/shmem.c"

      - name: Build online debug APK
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mh-build"
          ./gradlew --no-daemon --stacktrace \
            :app:assembleOnlineDebug

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$RUNNER_TEMP/mh-build"/app/build/outputs/apk/online/debug/*.apk \
            "$GITHUB_WORKSPACE/apk-output/"

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK for download
        uses: actions/upload-artifact@v7
        with:
          name: mobile-harness-patched-online-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7
