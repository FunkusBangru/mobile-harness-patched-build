

name: Build patched Mobile Harness APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mobile-Harness-1.0.7-ranked-features-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out build repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Restore dependencies and patch source
        run: |
          set -euo pipefail

          SOURCE_ZIP="Mobile-Harness-1.0.7-ranked-features-source.zip"
          test -f "$SOURCE_ZIP"

          mkdir -p "$RUNNER_TEMP/mh-patched"

          unzip -q "$SOURCE_ZIP" \
            -d "$RUNNER_TEMP/mh-patched"

          git clone --depth 1 \
            --branch v1.0.7 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/techjarves/Mobile-Harness.git \
            "$RUNNER_TEMP/mh-build"

          cp -a \
            "$RUNNER_TEMP/mh-patched/Mobile-Harness-1.0.7/." \
            "$RUNNER_TEMP/mh-build/"


          # Fix the malformed string resource before building.
          python3 - "$RUNNER_TEMP/mh-build/app/src/main/res/values/strings.xml" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit(f"ERROR: strings.xml not found: {path}")

          source = path.read_text(encoding="utf-8")
          pattern = r'<string\s+name="provider_local_model_help"[^>]*>.*?</string>'
          replacement = (
              '<string name="provider_local_model_help">'
              'Enter the model URL and model name, then test the connection.'
              '</string>'
          )
          result, count = re.subn(pattern, replacement, source, count=1, flags=re.DOTALL)

          if count != 1:
              raise SystemExit(f"Expected one matching string resource; found {count}")

          path.write_text(result, encoding="utf-8")
          print("Fixed provider_local_model_help")
          PY

         
          # Fix ConcurrentHashMap membership check.
          python3 - "$RUNNER_TEMP/mh-build/app/src/main/java/com/jarves/mh/runtime/ClaudeRuntimeBridge.kt" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit(f"Source file not found: {path}")

          source = path.read_text(encoding="utf-8")
          old = "if (approvalId in pending)"
          new = "if (pending.containsKey(approvalId))"

          count = source.count(old)
          if count != 1:
              raise SystemExit(
                  f"Expected one occurrence of the faulty expression; found {count}"
              )

          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          print("Fixed ConcurrentHashMap key lookup")
          PY

                    # Optimize runtime extraction and first-run maintenance.
          python3 - "$RUNNER_TEMP/mh-build/app/src/main/java/com/jarves/mh/runtime/RuntimeInstaller.kt" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          def replace_exact(source, old, new, expected, label):
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{label}: expected {expected} matches, found {count}. "
                      "No file was written; inspect the source version."
                  )
              return source.replace(old, new)

          # Keep package repair and repository refresh; skip the full upgrade.
          apt_old = (
              '            "apt-get -o DPkg::Lock::Timeout=120 -f install -y && " +\n'
              '            "apt-get -o DPkg::Lock::Timeout=120 update && " +\n'
              '            "apt-get -o DPkg::Lock::Timeout=120 upgrade -y"'
          )
          apt_new = (
              '            "apt-get -o DPkg::Lock::Timeout=120 -f install -y && " +\n'
              '            "apt-get -o DPkg::Lock::Timeout=120 update"'
          )
          apt_minimal = '            "apt-get -o DPkg::Lock::Timeout=120 -f install -y"'

          if source.count(apt_old) == 1:
              source = source.replace(apt_old, apt_new, 1)
          elif source.count(apt_new) == 1:
              print("Full Ubuntu upgrade already skipped.")
          elif source.count(apt_minimal) == 1:
              source = source.replace(apt_minimal, apt_new, 1)
          else:
              raise SystemExit("Could not identify the Ubuntu maintenance command.")

          display_old = (
              'displayCommand = "dpkg --configure -a && apt-get -f install -y '
              '&& apt-get update && apt-get upgrade -y",'
          )
          display_new = (
              'displayCommand = "dpkg --configure -a && apt-get -f install -y '
              '&& apt-get update",'
          )
          display_minimal = (
              'displayCommand = "dpkg --configure -a && apt-get -f install -y",'
          )

          if source.count(display_old) == 1:
              source = source.replace(display_old, display_new, 1)
          elif source.count(display_new) == 1:
              pass
          elif source.count(display_minimal) == 1:
              source = source.replace(display_minimal, display_new, 1)
          else:
              raise SystemExit("Could not identify the maintenance display label.")

          # Allocate one reusable buffer inside each archive reader.
          source = replace_exact(
              source,
              ".use { tar ->\n",
              ".use { tar ->\n"
              "            val copyBuffer = ByteArray(128 * 1024)\n"
              "            val canonicalRoot = destination.canonicalFile.toPath()\n",
              3,
              "TAR readers",
          )
          source = replace_exact(
              source,
              ".use { zip ->\n",
              ".use { zip ->\n"
              "            val copyBuffer = ByteArray(128 * 1024)\n"
              "            val canonicalRoot = destination.canonicalFile.toPath()\n",
              1,
              "ZIP reader",
          )

          source = replace_exact(
              source,
              "tar.copyTo(output)",
              "copyArchiveEntryBuffer(tar, output, copyBuffer)",
              3,
              "TAR file copies",
          )
          source = replace_exact(
              source,
              "zip.copyTo(output)",
              "copyArchiveEntryBuffer(zip, output, copyBuffer)",
              1,
              "ZIP file copies",
          )
          source = replace_exact(
              source,
              "FileOutputStream(target).use { input.copyTo(it) }",
              "FileOutputStream(target).use { output -> "
              "copyArchiveEntryBuffer(input, output, copyBuffer) }",
              6,
              "Archive hard-link copies",
          )

          # Cache the checksum reader's buffer size too.
          source = replace_exact(
              source,
              "val buffer = ByteArray(DEFAULT_BUFFER_SIZE)",
              "val buffer = ByteArray(128 * 1024)",
              1,
              "Checksum buffer",
          )

          # Preserve the archive path safety check but reuse the canonical root.
          source = replace_exact(
              source,
              "safeChild(destination, name)",
              "safeChild(destination, name, canonicalRoot)",
              1,
              "ZIP path checks",
          )
          source = replace_exact(
              source,
              "safeChild(destination, cleanName)",
              "safeChild(destination, cleanName, canonicalRoot)",
              2,
              "TAR path checks",
          )
          source = replace_exact(
              source,
              'safeChild(destination, entry.linkName.removePrefix("./"))',
              'safeChild(destination, entry.linkName.removePrefix("./"), canonicalRoot)',
              2,
              "TAR link path checks",
          )
          source = replace_exact(
              source,
              "safeChild(destination, relative)",
              "safeChild(destination, relative, canonicalRoot)",
              1,
              "Node.js path checks",
          )
          source = replace_exact(
              source,
              "safeChild(destination, relativeLink)",
              "safeChild(destination, relativeLink, canonicalRoot)",
              1,
              "Node.js link path checks",
          )

          source = replace_exact(
              source,
              "    private fun safeChild(root: File, relative: String): File {",
              "    private fun safeChild(root: File, relative: String, "
              "rootPath: java.nio.file.Path): File {",
              1,
              "Path safety function",
          )
          source = replace_exact(
              source,
              "        val rootPath = root.canonicalFile.toPath()\n",
              "",
              1,
              "Duplicate canonical-root calculation",
          )

          helper = """    private fun copyArchiveEntryBuffer(
              input: java.io.InputStream,
              output: java.io.OutputStream,
              buffer: ByteArray,
          ) {
              while (true) {
                  val count = input.read(buffer)
                  if (count < 0) break
                  output.write(buffer, 0, count)
              }
          }

          """
          marker = (
              "    private fun safeChild(root: File, relative: String, "
              "rootPath: java.nio.file.Path): File {"
          )
          source = replace_exact(
              source, marker, helper + marker, 1, "Archive copy helper"
          )


          # Fix buffer scope: deferred hard-link copies run outside the TAR reader.
for function_name in ("extractRootfs", "extractZstdTar", "extractNodeArchive"):
    start = source.find(f"    private fun {function_name}(") if start < 0:
        raise SystemExit(f"Could not find function: {function_name}")

  end = source.find("\n    private fun ", start + 1)
    if end < 0:
        end = len(source)

    block = source[start:end]

    inner = "            val copyBuffer = ByteArray(128 * 1024)\n"
    outer = "        val copyBuffer = ByteArray(128 * 1024)\n"
    anchor = "        val deferredLinks = mutableListOf<Pair<File, File>>()\n"

    if block.count(inner) == 1 and block.count(anchor) == 1:
        block = block.replace(anchor, outer + anchor, 1)
        block = block.replace(inner, "", 1)
    elif block.count(outer) == 1 and inner not in block:
        pass
    else:
        raise SystemExit(
            f"Could not safely fix buffer scope in {function_name}"
        )

    source = source[:start] + block + source[end:]

print("Fixed archive copy-buffer scope.")
          path.write_text(source, encoding="utf-8")
          print("Runtime I/O optimization applied successfully.")
          PY

          chmod +x "$RUNNER_TEMP/mh-build/gradlew"

          test -f \
            "$RUNNER_TEMP/mh-build/third_party/proot/src/cli/proot.c"

          test -f \
            "$RUNNER_TEMP/mh-build/third_party/libandroid-shmem/shmem.c"

      - name: Build online debug APK
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mh-build"
          ./gradlew --no-daemon --stacktrace \
            :app:assembleOnlineDebug

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$RUNNER_TEMP/mh-build"/app/build/outputs/apk/online/debug/*.apk \
            "$GITHUB_WORKSPACE/apk-output/"

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK for download
        uses: actions/upload-artifact@v7
        with:
          name: mobile-harness-patched-online-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7
